repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: 'v0.17.5'
  hooks:
    - id: ruff-format
    - id: ruff-check
- repo: https://github.com/rvben/rumdl-pre-commit
  rev: v0.3.4
  hooks:
    - id: rumdl      # Lint only; add args [--fix] to auto-fix
    - id: rumdl-fmt  # Pure format, always exits 0
- repo: https://github.com/codespell-project/codespell
  rev: 'v2.4.3'
  hooks:
    - id: codespell
      files: \.(py|rst|md)$
      args: [--ignore-words-list=ser]
- repo: https://github.com/adhtruong/mirrors-typos
  # Use mirror to avoid autoupdate issue: https://github.com/crate-ci/typos/issues/390
  rev: 'v1.52.2'
  hooks:
    - id: typos
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  -   id: trailing-whitespace
  -   id: name-tests-test
      exclude: |
        (?x)
          ^(tests/pydantic/utils\.py)
  -   id: end-of-file-fixer
  -   id: requirements-txt-fixer
  -   id: no-commit-to-branch
  -   id: check-json
  -   id: check-yaml
  -   id: check-ast
  -   id: check-added-large-files
- repo: local
  hooks:
    # Without include_extras=True, `Annotated` metadata is stripped (see #137).
    # shortcut: a nested call before the kwarg, e.g. `get_type_hints(f(x), include_extras=True)`,
    # is a false positive; switch to ruff banned-api + a wrapper if that becomes a problem.
    - id: get-type-hints-include-extras
      name: get_type_hints must use include_extras=True
      language: pygrep
      entry: 'get_type_hints\((?![^)]*include_extras=True)'
      args: [--multiline]
      types: [python]
